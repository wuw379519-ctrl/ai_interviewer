# Task 8a / 8b: real docker compose up evidence (GitHub-hosted runners have Docker).
# Path-filtered so routine Python-only pushes skip Docker; use workflow_dispatch to force a run.
name: Compose smoke

on:
  push:
    paths:
      - "infra/**"
      - "apps/api/Dockerfile"
      - "apps/api/docker-entrypoint.sh"
      - "apps/api/migrations/**"
      - "apps/api/interviewer/**"
      - "apps/api/requirements.txt"
      - "apps/api/requirements.lock"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    paths:
      - "infra/**"
      - "apps/api/Dockerfile"
      - "apps/api/docker-entrypoint.sh"
      - "apps/api/migrations/**"
      - "apps/api/interviewer/**"
      - "apps/api/requirements.txt"
      - "apps/api/requirements.lock"
      - ".github/workflows/compose-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-up:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Offline compose structure gate
        run: python infra/compose.validate.py
      - name: Build images
        run: docker compose -f infra/docker-compose.yml build api worker
      - name: Start postgres and redis
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis
      - name: Run migrate (visible)
        run: |
          set -e
          docker compose -f infra/docker-compose.yml run --rm --no-deps api migrate 2>&1 | tee migrate.out
      - name: Start api and worker
        run: |
          set -e
          docker compose -f infra/docker-compose.yml up -d api worker
          docker compose -f infra/docker-compose.yml ps
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml ps -a || true
          {
            echo "===== migrate.out ====="
            cat migrate.out 2>/dev/null || true
            echo "===== api logs ====="
            docker compose -f infra/docker-compose.yml logs api --no-color --tail=200 || true
            echo "===== worker logs ====="
            docker compose -f infra/docker-compose.yml logs worker --no-color --tail=80 || true
          } | tee compose-failure.txt
          # Prefer traceback / error lines in annotations (visible on Actions summary).
          grep -E "Error|Exception|Traceback|NOT_READY|postgres_|api_ready|dependency|exit" compose-failure.txt \
            | tail -n 60 \
            | while IFS= read -r line; do echo "::error::compose $line"; done || true
          tail -n 20 compose-failure.txt | while IFS= read -r line; do echo "::warning::compose $line"; done || true
      - name: Wait for api /api/ready
        run: |
          set -e
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/ready; then
              echo
              echo "api_ready_ok attempt=$i"
              exit 0
            fi
            sleep 3
          done
          echo "api_ready_timeout"
          docker compose -f infra/docker-compose.yml ps -a
          docker compose -f infra/docker-compose.yml logs api --no-color --tail=200
          exit 1
      - name: Worker process present
        run: |
          docker compose -f infra/docker-compose.yml ps
          docker compose -f infra/docker-compose.yml logs worker --tail=40
          docker compose -f infra/docker-compose.yml logs worker --tail=40 | grep -E "celery|ready|beat"
      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
