name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      DB_DRIVER: sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m ruff check --config apps/api/pyproject.toml apps/api scripts
      - run: python -m mypy --config-file apps/api/pyproject.toml apps/api/interviewer scripts
      - run: python -m pytest -c apps/api/pyproject.toml apps/api/tests
