# Optional edge for multi-replica API: sticky sessions for WebSocket (Task 8a option A).
# ip_hash keeps the same client IP on one upstream so in-process SessionStore still works.
# Cross-worker resume without sticky still fails — Redis SessionStore is the follow-up (D78).
upstream aii_api {
    ip_hash;
    server api:8000;
    # server api2:8000;  # add replicas behind the same sticky pool
}

server {
    listen 8080;
    location / {
        proxy_pass http://aii_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
